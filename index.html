<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet"> 
<link rel="stylesheet" href="style.css">
</head>
<body>
  <ul>
    <li>
      <button class="change-color-card-button">поменять цвет первой</button>
    </li>
    <li>
      <button class="change-color-allcards-button">поменять цвет всем</button>
    </li>
    <li>
      <button class="change-color-button second-color-button">поменять цвет кнопке</button>
    </li> 
    <li>
      <button class="open-google-button">открыть Google</button>
    </li>
  </ul>
  <p>введите количество карточек</p>
  <input class="input" placeholder="введите только число">
  <button class="input-button">отправить</button>
  <h1 class="title">Выбери свой продукт</h1>
  <ul class="product-list">
    <template class="product-template">
      <li class="product-card"> 
        <img class="product-card__image">
        <p class="product-card__description"></p>
        <h3 class="product-card__title"></h3>
        <span class="product-card__comment"></span>
        <br>
        <span class="product-card__list-title"></span>
        <ul class="product-card__component-list">
          <li class="li-1"></li>
          <li class="li-2"></li>
          <li class="li-3"></li>
        </ul>
        <div class="product-card__price">
          <h3 class="product-card__price-title"></h3>
          <h3 class="product-card__price-value"></h3> 
        </div>  
      </li>
    </template>
  </ul>
  <footer class="footer">
    <section class="footer__top">
      <section class="footer__about">
        <h2>Product Cards</h2>
        <span>У нас самые лучшие Продукты для кожи </span>
        <nav>
          <a href=""><img src="images/tg-icon.png" alt="telegram"></a>
          <a href=""><img src="images/vk-icon.png" alt="vk"></a>
        </nav>
      </section>
      <section class="footer__sales">
        <h2>Подпишись на наши акции:</h2>
        <form id="footer__form">
          <input type="email" id="footer__input" placeholder="Введите email...">
          <hr class="hr-vertical">
          <button type="submit" class="footer__button">Подписаться</button>
        </form>
      </section>
      <nav class="footer__site-navigation">
        <h3>Быстрые ссылки</h3>
        <a href="">Главная</a>
        <a href="">Магазин</a>
        <a href="">Контакты</a>
      </nav>
    </section>
    <section class="footer__bottom">
      <hr class="hr-horizontal">
      <span>www.product-card.com all right reserve</span>
    </section>
  </footer>
  <script src="homework-10.js" type="module"></script>
  <script src="comments.js" type="module"></script>
  <script src="main.js"></script>
</body>
</html>
